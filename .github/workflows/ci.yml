name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff -r requirements.txt
      - run: ruff check server.py
      - run: python -m py_compile server.py
      # Import smoke test: the server must load with NO credentials present.
      # Alpaca headers are read at import time, so provide placeholders;
      # the Kraken client is lazy by design and must not need anything.
      - run: |
          ALPACA_KEY_ID=x ALPACA_SECRET_KEY=x python -c "import server; print('tools:', len(server.mcp._tool_manager._tools))"
